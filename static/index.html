<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefing Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ── */
    :root {
      --paper:    #F7F5F0;
      --ink:      #1A1A18;
      --ink2:     #4A4A46;
      --ink3:     #8A8A84;
      --rule:     #E0DDD6;
      --rule2:    #CBC8BF;
      --signal:   #C0392B;   /* signal red — urgency only */
      --signal-dim: rgba(192,57,43,.08);
      --confirm:  #2D6A4F;
      --confirm-dim: rgba(45,106,79,.08);
      --white:    #FFFFFF;
      --mono:     'DM Sans', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Demo notice ── */
    .notice {
      background: var(--ink);
      color: rgba(247,245,240,.7);
      font-size: 12px;
      text-align: center;
      padding: 7px 20px;
      letter-spacing: .01em;
    }
    .notice strong { color: var(--paper); }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--rule);
      padding: 0 48px;
      display: flex;
      align-items: stretch;
      height: 60px;
      background: var(--white);
    }
    .wordmark {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 20px;
      color: var(--ink);
      display: flex;
      align-items: center;
      padding-right: 32px;
      border-right: 1px solid var(--rule);
      white-space: nowrap;
      letter-spacing: -.01em;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 0;
      flex: 1;
      padding-left: 24px;
    }
    .header-tag {
      font-size: 12px;
      color: var(--ink3);
      padding: 0 16px 0 0;
      border-right: 1px solid var(--rule);
      margin-right: 16px;
      font-weight: 400;
    }
    .header-tag:last-child { border-right: none; margin-right: 0; }
    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--confirm);
      margin-right: 6px;
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Brief history bar ── */
    .history-bar {
      border-bottom: 1px solid var(--rule);
      background: var(--white);
      padding: 0 48px;
      display: flex;
      align-items: center;
      gap: 0;
      height: 40px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .history-bar::-webkit-scrollbar { display: none; }
    .history-label {
      font-size: 11px;
      color: var(--ink3);
      margin-right: 16px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }
    .history-item {
      font-size: 12px;
      color: var(--ink2);
      padding: 0 14px;
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--rule);
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, color .12s;
      flex-shrink: 0;
    }
    .history-item:hover { background: var(--paper); color: var(--ink); }
    .history-item.active { color: var(--ink); font-weight: 500; background: var(--paper); }
    .history-empty { font-size: 12px; color: var(--ink3); }

    /* ── Page body ── */
    .page { max-width: 860px; margin: 0 auto; padding: 56px 48px 80px; }

    /* ── Input section ── */
    .input-section { margin-bottom: 56px; }

    .input-lede {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 32px;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 8px;
      letter-spacing: -.02em;
      max-width: 560px;
    }
    .input-sub {
      font-size: 14px;
      color: var(--ink3);
      margin-bottom: 28px;
      max-width: 480px;
      font-weight: 300;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 188px;
      background: var(--white);
      color: var(--ink);
      border: 1px solid var(--rule2);
      border-radius: 4px;
      padding: 16px 18px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color .15s;
    }
    textarea:focus { border-color: var(--ink2); }
    textarea::placeholder { color: var(--ink3); font-weight: 300; }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--ink2);
      border: 1px solid var(--rule2);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      background: var(--white);
      font-family: inherit;
    }
    .upload-btn:hover { border-color: var(--ink2); color: var(--ink); }

    #csv-input { display: none; }

    #csv-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--confirm);
      background: var(--confirm-dim);
      border: 1px solid rgba(45,106,79,.2);
      padding: 5px 10px;
      border-radius: 4px;
    }

    .sample-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink3);
      background: transparent;
      border: none;
      padding: 8px 4px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--rule2);
      transition: color .15s;
    }
    .sample-btn:hover { color: var(--ink); text-decoration-color: var(--ink2); }

    .run-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .run-btn:hover { background: #2e2e2b; }
    .run-btn:active { background: #111; }
    .run-btn:disabled { background: var(--rule2); color: var(--ink3); cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(247,245,240,.3);
      border-top-color: var(--paper);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: none;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .section-rule {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 0 0 36px;
    }

    /* ── Priority strip (top 3) ── */
    .priority-strip {
      margin-bottom: 48px;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink3);
      margin-bottom: 16px;
      letter-spacing: .02em;
    }
    .priority-list { display: flex; flex-direction: column; gap: 0; }

    .priority-row {
      display: flex;
      align-items: baseline;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      cursor: pointer;
      transition: background .1s;
    }
    .priority-row:first-child { border-top: 1px solid var(--rule); }
    .priority-row:hover { background: rgba(26,26,24,.02); }

    .p-rank {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: var(--signal);
      line-height: 1;
      width: 28px;
      flex-shrink: 0;
      text-align: right;
    }
    .p-body { flex: 1; min-width: 0; }
    .p-sender {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 1px;
    }
    .p-subject {
      font-size: 13px;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 480px;
      margin-bottom: 4px;
    }
    .p-summary {
      font-size: 13px;
      color: var(--ink3);
      font-weight: 300;
      line-height: 1.5;
    }
    .p-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .p-cat {
      font-size: 12px;
      color: var(--ink3);
      font-weight: 400;
      text-transform: capitalize;
    }
    .p-reply-flag {
      font-size: 12px;
      font-weight: 500;
      color: var(--signal);
    }

    /* ── Full item list ── */
    .items-section { margin-bottom: 48px; }
    .items-list { display: flex; flex-direction: column; }

    .item-row {
      border-bottom: 1px solid var(--rule);
    }
    .item-row:first-child { border-top: 1px solid var(--rule); }
    .item-row.suspicious { border-left: 3px solid var(--signal); }

    .item-trigger {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 14px 0;
      cursor: pointer;
      user-select: none;
    }
    .item-urg {
      width: 24px;
      flex-shrink: 0;
      text-align: center;
    }
    .urg-bar {
      display: inline-block;
      width: 3px;
      border-radius: 2px;
      background: var(--rule2);
      vertical-align: middle;
    }
    .urg-5 .urg-bar { background: var(--signal); height: 20px; }
    .urg-4 .urg-bar { background: #B7530A; height: 16px; }
    .urg-3 .urg-bar { background: var(--ink2); height: 12px; }
    .urg-2 .urg-bar { background: var(--rule2); height: 8px; }
    .urg-1 .urg-bar { background: var(--rule); height: 4px; }

    .item-main { flex: 1; min-width: 0; }
    .item-sender-line {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 1px;
    }
    .item-subject-line {
      font-size: 13px;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
    }
    .item-flags {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .flag-cat { font-size: 12px; color: var(--ink3); text-transform: capitalize; }
    .flag-reply { font-size: 12px; font-weight: 500; color: var(--signal); }
    .flag-suspicious { font-size: 12px; font-weight: 500; color: var(--signal); }
    .item-chevron {
      color: var(--ink3);
      transition: transform .18s;
      flex-shrink: 0;
      margin-top: -2px;
    }
    .item-row.expanded .item-chevron { transform: rotate(180deg); }

    .item-body {
      display: none;
      padding: 0 0 20px 40px;
    }
    .item-row.expanded .item-body { display: block; }

    .item-summary {
      font-size: 14px;
      color: var(--ink2);
      line-height: 1.65;
      margin-bottom: 20px;
      max-width: 620px;
      font-weight: 300;
    }

    /* ── Draft ── */
    .draft-wrap {
      margin-bottom: 16px;
      background: var(--white);
      border: 1px solid var(--rule2);
      border-radius: 4px;
      overflow: hidden;
    }
    .draft-head {
      padding: 11px 16px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
    }
    .draft-head-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink3);
      letter-spacing: .03em;
      flex-shrink: 0;
    }
    .draft-subject-text {
      font-size: 13px;
      color: var(--ink);
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .draft-status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .ds-pending  { background: rgba(183,83,10,.08); color: #B7530A; }
    .ds-approved { background: var(--confirm-dim); color: var(--confirm); }
    .ds-rejected { background: var(--signal-dim); color: var(--signal); }

    .draft-body-area { padding: 16px; }
    .draft-body {
      font-size: 13.5px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.75;
      color: var(--ink);
      white-space: pre-wrap;
      min-height: 72px;
      outline: none;
    }
    .draft-body[contenteditable="true"] {
      background: rgba(26,26,24,.03);
      border-radius: 3px;
      padding: 10px 12px;
      margin: -10px -12px;
      cursor: text;
    }
    .draft-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .draft-hint {
      font-size: 12px;
      color: var(--ink3);
      font-weight: 300;
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 3px;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background .12s, border-color .12s, color .12s;
    }
    .btn:active { opacity: .85; }
    .btn-approve {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .btn-approve:hover { background: #2e2e2b; }
    .btn-reject {
      background: transparent;
      color: var(--ink2);
      border-color: var(--rule2);
    }
    .btn-reject:hover { border-color: var(--ink2); color: var(--ink); }
    .btn-copy {
      background: transparent;
      color: var(--ink2);
      border-color: var(--rule2);
    }
    .btn-copy:hover { border-color: var(--ink2); color: var(--ink); }
    .btn-mailto {
      background: transparent;
      color: var(--ink2);
      border-color: var(--rule2);
    }
    .btn-mailto:hover { border-color: var(--ink2); color: var(--ink); }

    .post-approve { display: none; align-items: center; gap: 8px; }

    /* ── Tasks ── */
    .tasks-section { margin-bottom: 48px; }
    .task-list { display: flex; flex-direction: column; }
    .task-item {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
    }
    .task-item:first-child { border-top: 1px solid var(--rule); }
    .task-bullet {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--ink2);
      flex-shrink: 0;
      margin-top: 7px;
    }
    .task-text { flex: 1; color: var(--ink); font-weight: 400; }
    .task-due-text {
      font-size: 12px;
      color: #B7530A;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Loading ── */
    .loading-wrap {
      padding: 48px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sk {
      background: linear-gradient(90deg, var(--rule) 25%, var(--paper) 50%, var(--rule) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 3px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .sk-line { height: 13px; margin-bottom: 6px; }
    .sk-long { width: 75%; }
    .sk-med { width: 52%; }
    .sk-short { width: 35%; }

    /* ── Error ── */
    .error-row {
      padding: 14px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
      color: var(--signal);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .error-label { font-weight: 600; flex-shrink: 0; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 4px;
      padding: 11px 18px;
      font-size: 13px;
      font-weight: 400;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
      max-width: 300px;
      line-height: 1.5;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 3px; }

    /* ── Focus ── */
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      header { padding: 0 20px; }
      .history-bar { padding: 0 20px; }
      .page { padding: 36px 20px 60px; }
      .input-lede { font-size: 26px; }
      .item-flags { display: none; }
    }
  </style>
</head>
<body>

<div class="notice">
  Demo — use sample data only. <strong>Don't paste real confidential emails.</strong>
</div>

<header>
  <div class="wordmark">Briefing Agent</div>
  <div class="header-meta">
    <span class="header-tag">Gemini</span>
    <span class="header-tag">FastAPI</span>
    <span class="header-tag"><span class="live-dot"></span>Live</span>
  </div>
</header>

<div class="history-bar" id="history-bar">
  <span class="history-label">Recent</span>
  <span class="history-empty" id="history-empty">No briefs yet</span>
</div>

<div class="page">

  <!-- Input -->
  <section class="input-section" id="input-section">
    <p class="input-lede">Turn your inbox into a brief.</p>
    <p class="input-sub">Paste emails, meeting notes or upload a leads CSV. The agent classifies, prioritises, and drafts replies — you approve before anything goes out.</p>

    <textarea
      id="input-text"
      placeholder="Paste emails separated by ---&#10;&#10;From: Sarah Chen <sarah@vc.com>&#10;Subject: Series A term sheet&#10;&#10;Hi, we're ready to lead your round..."
      aria-label="Paste emails or notes"
    ></textarea>

    <input type="file" id="csv-input" accept=".csv" />

    <div class="input-row">
      <label class="upload-btn" for="csv-input">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Attach CSV
      </label>
      <div id="csv-badge">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="csv-name"></span>
      </div>
      <button class="sample-btn" onclick="loadSample()" type="button">Load sample emails</button>
      <button class="run-btn" id="run-btn" onclick="runAgent()">
        <div class="spinner" id="spinner"></div>
        <svg id="run-icon" width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="run-label">Generate brief</span>
      </button>
    </div>
  </section>

  <!-- Results -->
  <div id="results-area"></div>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let currentBriefId = null;

const SAMPLE_TEXT = `From: Sarah Chen <sarah.chen@horizonvc.com>
Subject: Follow-up: Series A term sheet

Hi Alex, great meeting last week. We've completed our partner review and would like to move forward with a $4M lead on your Series A at a $18M pre-money valuation. I'll send the formal term sheet by EOD Friday. We'll need an updated cap table and reference calls.

Sarah
---
From: Marcus Webb <m.webb@acme-manufacturing.com>
Subject: Urgent: Production line stopped

Our entire production line has been down since 6 AM. We believe the firmware update your team pushed last night broke the PLC integration. We are losing roughly $15,000 per hour. I need a call within the next hour or I will escalate to legal.

Marcus Webb
---
From: Dana Fischer <dana@legalcounsel-sf.com>
Subject: IP Assignment Agreement — signature required by Friday

Alex, attached is the updated IP assignment agreement for your three founding engineers. All parties need to sign before investor due diligence next week. Please countersign and return by Friday COB.

Dana Fischer
---
From: no-reply@cryptoprofits-alert.biz
Subject: EARN $50K/MONTH PASSIVE INCOME

You have been selected for our exclusive crypto arbitrage program. Zero risk, guaranteed 40% monthly returns. Click here NOW.

- The CryptoProfits Team
---
From: Raj Patel <raj.patel@luminarylabs.io>
Subject: Scheduling clash — board meeting needs to move

Alex, there's a conflict: the board meeting you scheduled for Oct 14 clashes with our Q3 investor update call. Can we move to Oct 16 or 17? Please confirm ASAP.

Raj`;

// ─── CSV ─────────────────────────────────────────────────────────────────────
document.getElementById('csv-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('csv-name').textContent = file.name;
  document.getElementById('csv-badge').style.display = 'flex';
  const reader = new FileReader();
  reader.onload = ev => {
    const existing = document.getElementById('input-text').value.trim();
    document.getElementById('input-text').value =
      (existing ? existing + '\n\n---\n\n' : '') + ev.target.result;
  };
  reader.readAsText(file);
});

// ─── Sample ───────────────────────────────────────────────────────────────────
function loadSample() {
  document.getElementById('input-text').value = SAMPLE_TEXT;
  showToast('Sample emails loaded.');
}

// ─── Run ──────────────────────────────────────────────────────────────────────
async function runAgent() {
  const text = document.getElementById('input-text').value.trim();
  if (!text) { showToast('Paste some content first.'); return; }

  setLoading(true);
  document.getElementById('results-area').innerHTML = '';

  try {
    const res = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (res.status === 429) { renderError('Rate limit reached (10 requests/hour). Try again shortly.'); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
      renderError(err.detail || `Server error ${res.status}`);
      return;
    }
    const brief = await res.json();
    currentBriefId = brief.id;
    renderBrief(brief);
    loadHistory();
    document.getElementById('results-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    renderError('Network error: ' + err.message);
  } finally {
    setLoading(false);
  }
}

// ─── Load saved brief ─────────────────────────────────────────────────────────
async function loadBrief(id) {
  setLoading(true);
  document.getElementById('results-area').innerHTML = showSkeleton();
  try {
    const res = await fetch(`/briefs/${id}`);
    if (!res.ok) { renderError('Brief not found.'); return; }
    const brief = await res.json();
    currentBriefId = brief.id;
    renderBrief(brief);
    highlightHistory(id);
  } finally {
    setLoading(false);
  }
}

async function loadHistory() {
  const res = await fetch('/briefs');
  if (!res.ok) return;
  const list = await res.json();
  const bar = document.getElementById('history-bar');
  const empty = document.getElementById('history-empty');
  if (!list.length) { if (empty) empty.style.display = ''; return; }
  // Remove existing items
  bar.querySelectorAll('.history-item').forEach(el => el.remove());
  if (empty) empty.style.display = 'none';
  list.forEach(b => {
    const el = document.createElement('div');
    el.className = 'history-item' + (b.id === currentBriefId ? ' active' : '');
    el.title = b.id;
    el.textContent = new Date(b.created_at).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    el.onclick = () => loadBrief(b.id);
    bar.appendChild(el);
  });
}

function highlightHistory(id) {
  document.querySelectorAll('.history-item').forEach(el => el.classList.toggle('active', el.title === id));
}

// ─── Render brief ─────────────────────────────────────────────────────────────
function renderBrief(brief) {
  const itemMap = Object.fromEntries(brief.items.map(i => [i.id, i]));
  const draftsByItem = {};
  brief.drafts.forEach(d => { (draftsByItem[d.item_id] ??= []).push(d); });
  const tasksByItem = {};
  brief.tasks.forEach(t => { if (t.item_id) (tasksByItem[t.item_id] ??= []).push(t); });
  const orphanTasks = brief.tasks.filter(t => !t.item_id);

  // Priority strip
  const priorityHtml = brief.top_3.length ? `
    <section class="priority-strip">
      <div class="section-label">Needs attention today</div>
      <div class="priority-list">
        ${brief.top_3.map((id, i) => {
          const item = itemMap[id];
          if (!item) return '';
          const sender = item.sender.replace(/<.*>/,'').trim() || item.sender;
          return `<div class="priority-row" onclick="expandItem('item-${id}')">
            <div class="p-rank">${i + 1}</div>
            <div class="p-body">
              <div class="p-sender">${esc(sender)}</div>
              <div class="p-subject">${esc(item.subject || '(no subject)')}</div>
              <div class="p-summary">${esc(item.summary.slice(0, 120))}${item.summary.length > 120 ? '…' : ''}</div>
            </div>
            <div class="p-meta">
              <span class="p-cat">${esc(item.category)}</span>
              ${item.needs_reply ? '<span class="p-reply-flag">reply needed</span>' : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>` : '';

  // All items
  const sorted = [...brief.items].sort((a, b) => b.urgency - a.urgency);
  const itemsHtml = `
    <section class="items-section">
      <div class="section-label">All items — ${brief.items.length} total, sorted by urgency</div>
      <div class="items-list">
        ${sorted.map(item => renderItemRow(item, draftsByItem[item.id] || [], tasksByItem[item.id] || [])).join('')}
      </div>
    </section>`;

  // Orphan tasks
  const tasksHtml = orphanTasks.length ? `
    <section class="tasks-section">
      <div class="section-label">Follow-up tasks</div>
      <div class="task-list">
        ${orphanTasks.map(t => `
          <div class="task-item">
            <div class="task-bullet"></div>
            <span class="task-text">${esc(t.title)}</span>
            ${t.due ? `<span class="task-due-text">Due ${esc(String(t.due))}</span>` : ''}
          </div>`).join('')}
      </div>
    </section>` : '';

  document.getElementById('results-area').innerHTML =
    '<hr class="section-rule">' + priorityHtml + itemsHtml + tasksHtml;
}

function renderItemRow(item, drafts, tasks) {
  const sender = item.sender.replace(/<.*>/,'').trim() || item.sender;

  const inlineTasks = tasks.length ? `
    <div style="margin-top:12px;margin-bottom:4px">
      <div class="task-list">
        ${tasks.map(t => `
          <div class="task-item" style="padding:8px 0">
            <div class="task-bullet"></div>
            <span class="task-text" style="font-size:13px">${esc(t.title)}</span>
            ${t.due ? `<span class="task-due-text">Due ${esc(String(t.due))}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>` : '';

  return `
    <div class="item-row urg-${item.urgency}${item.suspicious ? ' suspicious' : ''}" id="item-${item.id}">
      <div class="item-trigger" onclick="toggleItem('item-${item.id}')">
        <div class="item-urg"><span class="urg-bar"></span></div>
        <div class="item-main">
          <div class="item-sender-line">${esc(sender)}</div>
          <div class="item-subject-line">${esc(item.subject || '(no subject)')}</div>
        </div>
        <div class="item-flags">
          <span class="flag-cat">${esc(item.category)}</span>
          ${item.suspicious ? '<span class="flag-suspicious">suspicious</span>' : ''}
          ${item.needs_reply ? '<span class="flag-reply">reply needed</span>' : ''}
        </div>
        <svg class="item-chevron" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="item-body">
        <p class="item-summary">${esc(item.summary)}</p>
        ${drafts.map(d => renderDraft(d)).join('')}
        ${inlineTasks}
      </div>
    </div>`;
}

function renderDraft(d) {
  const isApproved = d.status === 'approved';
  const isRejected = d.status === 'rejected';
  const editable   = !isApproved && !isRejected;

  return `
    <div class="draft-wrap" id="draft-wrap-${d.id}">
      <div class="draft-head">
        <span class="draft-head-label">Draft reply</span>
        <span class="draft-subject-text">${esc(d.subject)}</span>
        <span class="draft-status ds-${d.status}" id="status-${d.id}">${d.status}</span>
      </div>
      <div class="draft-body-area">
        <div class="draft-body"
             id="body-${d.id}"
             ${editable ? 'contenteditable="true" role="textbox" aria-label="Edit draft reply"' : ''}
        >${esc(d.body)}</div>
      </div>
      <div class="draft-footer" id="actions-${d.id}">
        ${editable ? `
          <span class="draft-hint">Edit above if needed, then approve.</span>
          <button class="btn btn-approve" onclick="approveDraft('${d.id}')">Approve</button>
          <button class="btn btn-reject" onclick="rejectDraft('${d.id}')">Reject</button>
        ` : `<span class="draft-hint">${isApproved ? 'Approved.' : 'Rejected.'}</span>`}
        <div class="post-approve" id="post-${d.id}" style="${isApproved ? 'display:flex' : ''}">
          <button class="btn btn-copy" onclick="copyDraft('${d.id}')">Copy</button>
          <button class="btn btn-mailto" onclick="openMailto('${d.id}')">Open in email app</button>
        </div>
      </div>
    </div>`;
}

// ─── Toggle item ──────────────────────────────────────────────────────────────
function toggleItem(id) {
  document.getElementById(id)?.classList.toggle('expanded');
}
function expandItem(id) {
  const el = document.getElementById(id);
  if (el) { el.classList.add('expanded'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

// ─── Draft actions ────────────────────────────────────────────────────────────
async function approveDraft(id) {
  const bodyEl = document.getElementById('body-' + id);
  const res = await fetch(`/drafts/${id}/approve`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ edited_body: bodyEl?.innerText ?? null }),
  });
  if (!res.ok) { showToast('Approval failed.'); return; }
  updateDraftUI(id, 'approved');
  showToast('Draft approved — copy or open in your email app.');
}

async function rejectDraft(id) {
  const reason = prompt('Reason for rejection? (optional)') ?? '';
  const res = await fetch(`/drafts/${id}/reject`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reason }),
  });
  if (!res.ok) { showToast('Rejection failed.'); return; }
  updateDraftUI(id, 'rejected');
  showToast('Draft rejected.');
}

function updateDraftUI(id, newStatus) {
  const chip = document.getElementById('status-' + id);
  if (chip) { chip.className = `draft-status ds-${newStatus}`; chip.textContent = newStatus; }
  const actionsEl = document.getElementById('actions-' + id);
  if (actionsEl) {
    actionsEl.querySelectorAll('.btn-approve, .btn-reject, .draft-hint').forEach(el => el.remove());
    const hint = document.createElement('span');
    hint.className = 'draft-hint';
    hint.textContent = newStatus === 'approved' ? 'Approved.' : 'Rejected.';
    actionsEl.prepend(hint);
  }
  const bodyEl = document.getElementById('body-' + id);
  if (bodyEl) { bodyEl.removeAttribute('contenteditable'); if (newStatus === 'rejected') bodyEl.style.opacity = '.5'; }
  if (newStatus === 'approved') {
    const post = document.getElementById('post-' + id);
    if (post) post.style.display = 'flex';
  }
}

function copyDraft(id) {
  const bodyEl = document.getElementById('body-' + id);
  if (!bodyEl) return;
  navigator.clipboard.writeText(bodyEl.innerText)
    .then(() => showToast('Copied.'))
    .catch(() => showToast('Copy failed — select and copy manually.'));
}

function openMailto(id) {
  const wrap = document.getElementById('draft-wrap-' + id);
  const subject = wrap?.querySelector('.draft-subject-text')?.textContent || '';
  const body    = document.getElementById('body-' + id)?.innerText || '';
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setLoading(on) {
  document.getElementById('run-btn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('run-icon').style.display = on ? 'none' : 'block';
  document.getElementById('run-label').textContent = on ? 'Generating…' : 'Generate brief';
}

function renderError(msg) {
  document.getElementById('results-area').innerHTML = `
    <hr class="section-rule">
    <div class="error-row">
      <span class="error-label">Error</span>
      <span>${esc(msg)}</span>
    </div>`;
}

function showSkeleton() {
  return `<div class="loading-wrap">
    <hr class="section-rule" style="margin-bottom:0">
    <div class="sk sk-line sk-long"></div>
    <div class="sk sk-line sk-med"></div>
    <div class="sk sk-line sk-short"></div>
    <div class="sk sk-line sk-long" style="margin-top:16px"></div>
    <div class="sk sk-line sk-med"></div>
  </div>`;
}

function showToast(msg, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadHistory();
</script>
